services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PREFIX=/api/v1
      - MONGODB_URI=mongodb://mongo:27017/ecommerce
      - JWT_ACCESS_SECRET=prod_super_secret_access_jwt_key_at_least_32_characters!
      - JWT_REFRESH_SECRET=prod_super_secret_refresh_jwt_key_at_least_32_characters!
      - PAYMENT_PROVIDER=mock
      - CORS_ORIGIN=*
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ecommerce-net

  mongo:
    image: mongo:7.0
    container_name: ecommerce-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ecommerce-net

  mongo-express:
    image: mongo-express:latest
    container_name: ecommerce-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    depends_on:
      - mongo
    networks:
      - ecommerce-net

volumes:
  mongo-data:
    driver: local

networks:
  ecommerce-net:
    driver: bridge
